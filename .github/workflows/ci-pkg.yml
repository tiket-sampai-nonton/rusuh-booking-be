name: ci-pkg

on:
  push:
    branches: [main]
    paths:
      - "pkg/**"
      - "pkg/**"
      - ".golangci.yml"
      - ".github/workflows/ci-pkg.yml"
  pull_request:
    paths:
      - "pkg/**"
      - "pkg/**"
      - ".golangci.yml"
      - ".github/workflows/ci-pkg.yml"

permissions:
  contents: read

concurrency:
  group: ci-pkg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pkg/go.mod
          cache-dependency-path: pkg/go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          working-directory: pkg
          args: --config=${{ github.workspace }}/.golangci.yml
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
