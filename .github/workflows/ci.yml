name: ci

# Pipeline bertahap (satu file, matrix per modul/service):
#   code-quality -> verify-code-quality -> case-coverage -> code-rank -> build -> package
#   -> scan-package -> publish (multi-arch amd64+arm64) -> deployment-dev (SSH ke VPS) -> deployment-prod
# Deployment dev dan prod selalu menunggu persetujuan reviewer (environment dev/prod > Required reviewers). Push ke main
# menjalankan pipeline dan menyiapkan deployment-dev di run yang sama: klik "Review deployments" untuk deploy, atau Reject bila
# tidak ingin deploy. Run workflow (deploy_env) dan label PR `deploy-dev` juga lewat persetujuan yang sama. Prod hanya dari Run workflow.
# Cara mengatur nilai yang ditandai GANTI: lihat README bagian "CI/CD".

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Environment tujuan deploy (none = hanya build, scan, dan publish)"
        type: choice
        options: [none, dev, prod]
        default: none

permissions:
  contents: read

# Run yang menunggu persetujuan masih "in progress", jadi push/dispatch memakai grup per run agar tidak menahan pipeline berikutnya.
# Hanya PR yang berbagi grup per ref (push baru membatalkan run PR lama). Deploy dev diserialkan oleh grup job deploy-dev.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COVERAGE_MIN: "80"
  IMAGE_FAIL_SEVERITY: "CRITICAL"
  REGISTRY: ghcr.io
  # Image dibangun multi-arch: linux/amd64 (VPS dev, runner ubuntu-latest) dan linux/arm64 (EC2 Graviton, runner ARM GitHub;
  # ganti lewat repo variable ARM_RUNNER bila perlu). Keduanya build native (tanpa emulasi) lalu digabung jadi satu manifest saat publish.
  # GANTI bila pindah ke ECR: REGISTRY menjadi <akun>.dkr.ecr.<region>.amazonaws.com

jobs:
  # ------------------------------------------------------------------ penentu modul
  changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      services: ${{ steps.detect.outputs.services }}
      any: ${{ steps.detect.outputs.any }}
      any_services: ${{ steps.detect.outputs.any_services }}
      contracts: ${{ steps.detect.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash tools/detect-changes.sh

  # ------------------------------------------------------------------ stage: contracts
  # Berdiri sendiri: hanya jalan bila docs/contracts/ atau tools/contracts/ berubah. Memvalidasi 7 OpenAPI 3.1
  # (kin-openapi) dan semua schema event JSON Schema 2020-12 (platform R5.1).
  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: tools/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/contracts/go.mod
          cache-dependency-path: tools/contracts/go.sum
      - name: go.mod dan go.sum rapi
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Validasi kontrak (OpenAPI 3.1, JSON Schema 2020-12)
        run: go run . ../../docs/contracts
      - name: Tes validator
        run: go test -count=1 ./...

  # ------------------------------------------------------------------ stage: code-quality
  code-quality:
    name: code-quality (${{ matrix.module.name }})
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module.path }}/go.mod
          cache-dependency-path: ${{ matrix.module.path }}/go.sum
      - name: go.mod dan go.sum rapi
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || { echo "::error::go.mod/go.sum belum rapi atau go.sum belum di-commit. Jalankan 'make tidy' lalu commit."; exit 1; }
      - name: Mock (_mock/) sesuai port
        if: matrix.module.name != 'pkg'
        run: |
          go generate ./internal/...
          git diff --exit-code -- _mock || { echo "::error::_mock/ tidak sesuai interface port. Jalankan 'make mock' lalu commit."; exit 1; }
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0  # dibangun dengan Go ≥ 1.26 (syarat lint modul go 1.26)
          working-directory: ${{ matrix.module.path }}
          args: --config=${{ github.workspace }}/.golangci.yml
      - name: go vet
        run: go vet ./...
      - name: gosec
        run: |
          mkdir -p "$GITHUB_WORKSPACE/reports"
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0
          "$(go env GOPATH)/bin/gosec" -no-fail -fmt json -out "$GITHUB_WORKSPACE/reports/gosec.json" ./...
      - name: govulncheck (pengganti gemnasium)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/reports"
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" -format sarif ./... > "$GITHUB_WORKSPACE/reports/govulncheck.sarif"
      - name: hadolint
        if: matrix.module.name != 'pkg'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/reports"
          docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --format json - \
            < deployments/Dockerfile > "$GITHUB_WORKSPACE/reports/hadolint.json" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-${{ matrix.module.name }}
          path: reports
          if-no-files-found: warn
          retention-days: 7

  secret-detection:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect \
            --source /repo --redact --no-banner --exit-code 0 \
            --report-format json --report-path /repo/reports/gitleaks.json
          [ -f reports/gitleaks.json ] || echo '[]' > reports/gitleaks.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-secrets
          path: reports
          retention-days: 7

  # ------------------------------------------------------------------ stage: verify-code-quality
  verify-code-quality:
    needs: [changes, code-quality, secret-detection]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: quality-*
          path: scan-reports
      - name: Periksa laporan (gosec HIGH, govulncheck, hadolint error, gitleaks)
        run: bash tools/verify-reports.sh quality scan-reports

  # ------------------------------------------------------------------ stage: case-coverage (unit test)
  # Unit test + integration test adapter (PostgreSQL, Valkey, RabbitMQ sebagai service container).
  case-coverage:
    name: case-coverage (${{ matrix.module.name }})
    needs: [changes, verify-code-quality]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rbt
          POSTGRES_PASSWORD: rbt-ci-only
          POSTGRES_DB: rbt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rbt -d rbt" --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:8.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      GO_TEST_TAGS: integration
      TEST_POSTGRES_DSN: postgres://rbt:rbt-ci-only@localhost:5432/rbt?sslmode=disable
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_USER: rbt
      TEST_POSTGRES_PASSWORD: rbt-ci-only
      TEST_POSTGRES_DATABASE: rbt
      TEST_VALKEY_SERVER: '[{"host":"localhost","port":6379}]'
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module.path }}/go.mod
          cache-dependency-path: ${{ matrix.module.path }}/go.sum
      - name: Unit + integration test dan ambang coverage
        run: bash tools/check-coverage.sh "${{ matrix.module.path }}" "$COVERAGE_MIN"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.module.name }}
          path: coverage/${{ matrix.module.name }}.out
          retention-days: 7

  # ------------------------------------------------------------------ stage: code-rank (SonarCloud)
  code-rank:
    needs: [changes, case-coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - name: SonarCloud dinonaktifkan
        if: vars.SONAR_ENABLED != 'true'
        run: |
          echo "::notice::code-rank dilewati. Aktifkan dengan repo variable SONAR_ENABLED=true, SONAR_ORGANIZATION, SONAR_PROJECT_KEY dan secret SONAR_TOKEN."
          echo "- code-rank: DILEWATI (SONAR_ENABLED belum true)" >> "$GITHUB_STEP_SUMMARY"
      - name: SonarCloud scan
        if: vars.SONAR_ENABLED == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true

  # ------------------------------------------------------------------ stage: build
  build:
    name: build (${{ matrix.module.name }})
    needs: [changes, code-rank]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module.path }}/go.mod
          cache-dependency-path: ${{ matrix.module.path }}/go.sum
      - name: Compile
        run: go build ./...
      - name: Isolation build (tanpa go.work)
        run: GOWORK=off go build ./...

  # ------------------------------------------------------------------ stage: package (dockerize)
  package:
    name: package (${{ matrix.service.name }}, ${{ matrix.arch }})
    needs: [changes, build]
    if: needs.changes.outputs.any_services == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && (vars.ARM_RUNNER || 'ubuntu-24.04-arm') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: |
          docker build --platform linux/${{ matrix.arch }} -f ${{ matrix.service.path }}/deployments/Dockerfile \
            -t rusuh-booking-${{ matrix.service.name }}:${{ github.sha }} .
          docker image inspect --format '{{.Os}}/{{.Architecture}}' rusuh-booking-${{ matrix.service.name }}:${{ github.sha }}
          docker save -o image-${{ matrix.service.name }}-${{ matrix.arch }}.tar \
            rusuh-booking-${{ matrix.service.name }}:${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.service.name }}-${{ matrix.arch }}
          path: image-${{ matrix.service.name }}-${{ matrix.arch }}.tar
          retention-days: 1

  # ------------------------------------------------------------------ stage: scan-package
  scan-package:
    name: scan-image (${{ matrix.service.name }})
    needs: [changes, package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      # Dipindai: image amd64. Kode, dependency Go, dan base image distroless sama untuk kedua arsitektur.
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.service.name }}-amd64
      - name: Trivy scan image
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/work" aquasec/trivy:0.58.1 image \
            --input /work/image-${{ matrix.service.name }}-amd64.tar \
            --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            --format json --output /work/reports/trivy-${{ matrix.service.name }}.json
      - name: SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          docker run --rm -v "$PWD:/work" aquasec/trivy:0.58.1 image \
            --input /work/image-${{ matrix.service.name }}-amd64.tar --no-progress \
            --format cyclonedx --output /work/sbom/sbom-${{ matrix.service.name }}.cdx.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scan-${{ matrix.service.name }}
          path: reports
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.service.name }}
          path: sbom/sbom-${{ matrix.service.name }}.cdx.json
          retention-days: 30

  scan-package-verify:
    needs: [changes, scan-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: scan-*
          path: scan-reports
      - name: Periksa hasil scan image (gagal bila ada severity di IMAGE_FAIL_SEVERITY)
        run: bash tools/verify-reports.sh image scan-reports

  # ------------------------------------------------------------------ stage: publish
  publish:
    name: publish (${{ matrix.service.name }})
    needs: [changes, scan-package-verify]
    # Dari main (push), Run workflow dengan deploy_env dev/prod, atau PR milik member (branch di repo ini, bukan fork,
    # bukan Dependabot) yang diberi label `deploy-dev`. PR lain hanya sampai scan. Tag `main` hanya diberikan oleh main;
    # selain itu hanya tag <sha>.
    if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'workflow_dispatch' && inputs.deploy_env != 'none') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'deploy-dev'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: image-${{ matrix.service.name }}-*
          merge-multiple: true
      - name: Login registry (GHCR)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
      # GANTI bila memakai ECR: ganti langkah login di atas dengan aws-actions/configure-aws-credentials
      # (OIDC, role dari repo variable AWS_ROLE_ARN_PUBLISH) lalu aws-actions/amazon-ecr-login.
      - name: Push per arsitektur lalu gabung jadi manifest multi-arch
        run: |
          repo="$REGISTRY/${GITHUB_REPOSITORY,,}/${{ matrix.service.name }}"
          local_ref="rusuh-booking-${{ matrix.service.name }}:${{ github.sha }}"
          for arch in amd64 arm64; do
            docker load -i "image-${{ matrix.service.name }}-$arch.tar"
            docker tag "$local_ref" "$repo:${{ github.sha }}-$arch"
            docker push "$repo:${{ github.sha }}-$arch"
          done
          tags=(-t "$repo:${{ github.sha }}")
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags+=(-t "$repo:main"); fi
          docker buildx imagetools create "${tags[@]}" \
            "$repo:${{ github.sha }}-amd64" "$repo:${{ github.sha }}-arm64"
          digest="$(docker buildx imagetools inspect "$repo:${{ github.sha }}" --format '{{.Manifest.Digest}}')"
          echo "- publish (amd64+arm64): $repo@$digest" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ stage: deployment-dev (menunggu persetujuan)
  deployment-dev:
    needs: [changes, publish]
    # Push ke main, Run workflow dengan deploy_env=dev atau prod (prod ikut men-deploy dev), atau PR member berlabel `deploy-dev` (syarat sama dengan publish).
    # Semuanya menunggu persetujuan reviewer environment dev. Prod tidak pernah dari PR.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.deploy_env == 'dev' || inputs.deploy_env == 'prod')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'deploy-dev'))
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      # Environment "dev": variable DEV_HOST (mis. dev.rusuhbooking.my.id), DEV_USER (deploy), dan DEV_SSH_PORT (bawaan 22);
      # secret DEV_SSH_KEY (private key khusus deploy) dan DEV_SSH_KNOWN_HOSTS (hasil ssh-keyscan -t ed25519 <host>).
      # Panduan: PANDUAN-INFRA-DEV-VPS-DAN-AWS.md bagian 5.
      - name: Periksa konfigurasi
        id: cfg
        env:
          DEV_HOST: ${{ vars.DEV_HOST }}
          DEV_USER: ${{ vars.DEV_USER }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEV_HOST" ] || [ -z "$DEV_USER" ] || [ -z "$DEV_SSH_KEY" ] || [ -z "$DEV_SSH_KNOWN_HOSTS" ]; then
            echo "::warning::DEV_HOST/DEV_USER/DEV_SSH_KEY/DEV_SSH_KNOWN_HOSTS belum lengkap di environment dev; deploy dilewati."
            echo "- deployment-dev: DILEWATI (konfigurasi environment dev belum lengkap)" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Siapkan SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEV_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Kirim konfigurasi deploy ke server
        if: steps.cfg.outputs.ready == 'true'
        env:
          TARGET: ${{ vars.DEV_USER }}@${{ vars.DEV_HOST }}
          SSH_PORT: ${{ vars.DEV_SSH_PORT || '22' }}
        run: |
          # Hanya file yang dibutuhkan Compose: deployments/dev, init SQL, dan provisioning Grafana (path relatif dipertahankan).
          # Skrip sinkron di bawah SAMA dengan REMOTE_SYNC di deployments/dev/push-config.sh (ubah keduanya bersamaan).
          REMOTE_SYNC=$(cat <<'EOS'
          set -eu
          # Sinkronkan konfigurasi dari repo ke server TANPA meninggalkan berkas lama: berkas di deployments/observability yang sudah
          # dihapus atau di-rename di repo ikut dihapus (dashboard dan alert lama bisa bentrok, uid sama). Yang dihapus hanya BERKAS,
          # bukan folder: Grafana memasang folder itu sebagai bind mount, dan folder yang dihapus lalu dibuat ulang tidak terlihat
          # container sampai di-recreate. cp menimpa berkas di tempat, jadi inode folder dan berkas yang ada tidak berganti.
          R="${RUSUH_REPO:-/opt/rusuh/repo}"
          T="$(mktemp -d)"
          trap 'rm -rf "$T"' EXIT
          mkdir -p "$R"
          tar -C "$T" -xzf -
          if [ -d "$R/deployments/observability" ]; then
            (cd "$R" && find deployments/observability -type f) | while IFS= read -r f; do
              [ -e "$T/$f" ] || rm -v "$R/$f"
            done
          fi
          cp -a "$T"/. "$R"/
          EOS
          )
          tar -C . -czf - deployments/dev deployments/compose/postgres-init.sql deployments/observability \
            | ssh -p "$SSH_PORT" "$TARGET" "$REMOTE_SYNC"
      - name: Deploy ke dev
        if: steps.cfg.outputs.ready == 'true'
        env:
          TARGET: ${{ vars.DEV_USER }}@${{ vars.DEV_HOST }}
          SSH_PORT: ${{ vars.DEV_SSH_PORT || '22' }}
          SERVICES: ${{ needs.changes.outputs.services }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          prefix="$REGISTRY/${GITHUB_REPOSITORY,,}"
          # Hanya service yang berubah yang di-publish dengan tag sha ini; service lain memakai tag `main`.
          tags="$(jq -r --arg sha "$GITHUB_SHA" '.[].name | "TAG_\(ascii_upcase)=\($sha)"' <<<"$SERVICES" | tr '\n' ' ')"
          # Server menarik image dari GHCR (privat bila repo privat). Token run ini (hanya baca package, kedaluwarsa setelah job)
          # dikirim lewat stdin; tidak ada PAT yang tersimpan di repo atau perlu diatur manual.
          printf '%s' "$GH_TOKEN" | ssh -p "$SSH_PORT" "$TARGET" "docker login $REGISTRY -u '$GH_ACTOR' --password-stdin"
          ssh -p "$SSH_PORT" "$TARGET" "IMAGE_PREFIX='$prefix' IMAGE_TAG=main $tags bash /opt/rusuh/repo/deployments/dev/deploy.sh"
          echo "- deployment-dev: $tags(sisanya :main) ke ${{ vars.DEV_HOST }}" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ stage: deployment-prod (manual)
  deployment-prod:
    needs: [changes, publish]
    # Prod hanya dari main.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_env == 'prod' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Aktifkan Required reviewers pada environment "prod" (Settings > Environments) agar butuh persetujuan.
    environment: prod
    permissions:
      contents: read
      packages: read
    env:
      ENV_NAME: prod
      IMAGE_TAG: git-${{ github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      API_DOMAIN: ${{ vars.PROD_API_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Periksa konfigurasi
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # Tidak dilewati diam-diam: permintaan deploy prod tanpa konfigurasi harus gagal.
          [ -n "$KEY_ID" ] && [ -n "$KEY_SECRET" ] && [ -n "$AWS_REGION" ] && [ -n "$API_DOMAIN" ] || {
            echo "::error::isi secrets AWS_ACCESS_KEY_ID dan AWS_SECRET_ACCESS_KEY (environment prod) serta variables AWS_REGION dan PROD_API_DOMAIN. Langkahnya di panduan infra 8.10"; exit 1; }
      # Akun AWS Free plan memblokir OIDC provider, jadi memakai access key IAM user khusus CI (policy sempit dari Terraform).
      - name: Kredensial AWS (IAM user CI)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Salin image yang sudah lolos scan dari GHCR ke ECR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          ecr="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login "$ecr" -u AWS --password-stdin
          for s in queue booking payment notification user; do
            # Tag ECR immutable: run ulang commit yang sama tidak boleh gagal di sini.
            if ! aws ecr describe-images --repository-name "rusuh-$ENV_NAME/$s" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
              docker buildx imagetools create -t "$ecr/rusuh-$ENV_NAME/$s:$IMAGE_TAG" "$REGISTRY/${GITHUB_REPOSITORY,,}/$s:${{ github.sha }}"
            fi
          done
      - name: Deploy ke prod
        run: |
          bash deployments/terraform/deploy-aws.sh
          echo "- deployment-prod: $IMAGE_TAG ke $API_DOMAIN" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ gerbang tunggal untuk ruleset
  ci-ok:
    if: always()
    needs:
      - changes
      - contracts
      - code-quality
      - secret-detection
      - verify-code-quality
      - case-coverage
      - code-rank
      - build
      - package
      - scan-package
      - scan-package-verify
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Semua stage lulus atau dilewati
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled'; then
            echo "::error::ada stage yang gagal atau dibatalkan"
            exit 1
          fi
