{{template "top" .}}
    <tr><td style="background:#ffffff;border-radius:24px;overflow:hidden;padding:0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr><td bgcolor="#EC1C24" style="background-color:#EC1C24;background-image:linear-gradient(135deg,#ff5a2d,#EC1C24);padding:30px 22px 16px;color:#ffffff;">
          <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:800;opacity:.9;">Kode login</div>
          <div style="font-size:20px;line-height:1.3;font-weight:800;margin-top:6px;">Masuk ke Rusuh Booking Tiket</div>
        </td></tr>
        <tr><td style="padding:22px;">
          <div style="font-size:14px;line-height:1.5;color:#3a3a42;">Masukkan kode berikut untuk melanjutkan login:</div>
          <div style="background:#f4f4f6;border-radius:14px;padding:18px;text-align:center;margin:16px 0;">
            <div style="font-family:'Courier New',monospace;font-size:34px;font-weight:800;letter-spacing:8px;color:#0a0a0c;">{{.Code}}</div>
          </div>
          <div style="font-size:13px;line-height:1.6;color:#6b6b74;">Berlaku hingga <strong style="color:#0a0a0c;">{{formatClock .ExpiresAt}}</strong>.<br>Jangan bagikan kode ini kepada siapa pun, termasuk pihak yang mengaku dari kami.</div>
        </td></tr>
      </table>
    </td></tr>
{{template "bottom" .}}
