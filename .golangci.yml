version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - misspell
    - unconvert
    - bodyclose
  settings:
    depguard:
      rules:
        queue-domain:
          files: ["**/services/queue/internal/queue/domain/**"]
          deny:
            - pkg: "github.com/tiket-sampai-nonton/rusuh-booking-be/pkg"
              desc: "domain hanya boleh standard library (Handbook §0)"
            - pkg: "github.com/tiket-sampai-nonton/rusuh-booking-be/services/queue/internal/queue/port"
              desc: "domain tidak bergantung pada port"
            - pkg: "github.com/tiket-sampai-nonton/rusuh-booking-be/services/queue/internal/queue/application"
              desc: "domain tidak bergantung pada application"
            - pkg: "github.com/tiket-sampai-nonton/rusuh-booking-be/services/queue/internal/queue/infrastructure"
              desc: "domain tidak bergantung pada infrastructure"
            - pkg: "net/http"
              desc: "domain bebas framework/transport"
            - pkg: "database/sql"
              desc: "domain bebas driver"
        queue-port:
          files: ["**/services/queue/internal/queue/port/**"]
          deny:
            - pkg: "github.com/tiket-sampai-nonton/rusuh-booking-be/services/queue/internal/queue/application"
              desc: "port tidak bergantung pada application"
            - pkg: "github.com/tiket-sampai-nonton/rusuh-booking-be/services/queue/internal/queue/infrastructure"
              desc: "port tidak bergantung pada infrastructure"
        queue-application:
          files: ["**/services/queue/internal/queue/application/**"]
          deny:
            - pkg: "github.com/tiket-sampai-nonton/rusuh-booking-be/services/queue/internal/queue/infrastructure"
              desc: "usecase hanya bergantung pada port (SDD §4.3)"
            - pkg: "net/http"
              desc: "usecase bebas transport"
        queue-infrastructure:
          files: ["**/services/queue/internal/queue/infrastructure/**"]
          deny:
            - pkg: "github.com/tiket-sampai-nonton/rusuh-booking-be/services/queue/internal/queue/application"
              desc: "adapter memanggil port, bukan usecase langsung"

        booking-domain:
