sonar.sources=.
sonar.exclusions=tests/k6/**,**/_mock/**,**/*_test.go,docs/**,specs/**,.github/**,.kiro/**,.claude/**,deployments/**,**/deployments/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# Duplikasi: cmd/ dan internal/delivery/ adalah kerangka yang sengaja disalin per service (tiap service berdiri sendiri,
# dibuktikan `make isolation`), jadi tidak dihitung sebagai duplikasi. Kode lain tetap dihitung.
sonar.cpd.exclusions=**/cmd/**,**/internal/delivery/**
# tools/, tests/e2e/, dan pkg/ dikecualikan dari hitungan coverage saja; tetap dianalisis (bukan sonar.exclusions).
sonar.coverage.exclusions=**/cmd/**,**/delivery/**,**/config/**,**/_mock/**,tools/**,tests/e2e/**,pkg/**
sonar.go.coverage.reportPaths=coverage/*.out
sonar.organization=tiket-sampai-nonton
sonar.projectKey=tiket-sampai-nonton_rusuh-booking-be
sonar.host.url=https://sonarcloud.io

# Pengecualian issue yang DISENGAJA. Sempit (aturan + lokasi), tiap butir beralasan; jumlahnya dicatat di
# docs/evidence/2026-11-10-sonar-pengecualian.md. Yang bukan konvensi (mis. kontras warna) tidak diabaikan.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
# e1: S8196 menyarankan nama antarmuka satu method berakhiran "-er". Port hexagonal repo ini memakai awalan "I"
#     (IJoinUsecase, IQueueStore; lihat ADR dan docs/analisa/04-SDD) agar peran port terbaca dari namanya.
sonar.issue.ignore.multicriteria.e1.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.e1.resourceKey=services/**/port/**
# e2: S1827 menandai atribut HTML "width" sebagai usang. Template email butuh atribut itu: Outlook (mesin render Word)
#     mengabaikan CSS width pada tabel/gambar.
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:S1827
sonar.issue.ignore.multicriteria.e2.resourceKey=services/notification/assets/templates/**
# e3: S8239 minta memakai ctx yang ada. Shutdown HTTP berjalan SETELAH ctx dibatalkan, jadi wajib context baru
#     (pkg/httpx/server.go).
sonar.issue.ignore.multicriteria.e3.ruleKey=godre:S8239
sonar.issue.ignore.multicriteria.e3.resourceKey=pkg/httpx/server.go
# e4: sama untuk republish pesan RabbitMQ yang harus selesai walau ctx konsumen dibatalkan agar pesan tidak hilang
#     (pkg/rabbitmq/consumer.go).
sonar.issue.ignore.multicriteria.e4.ruleKey=godre:S8239
sonar.issue.ignore.multicriteria.e4.resourceKey=pkg/rabbitmq/consumer.go
