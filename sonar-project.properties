sonar.sources=.
sonar.exclusions=**/_mock/**,**/*_test.go,docs/**,specs/**,.github/**,.kiro/**,deployments/**,**/deployments/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# tools/, tests/e2e/, dan pkg/ dikecualikan dari hitungan coverage saja; tetap dianalisis (bukan sonar.exclusions).
sonar.coverage.exclusions=**/cmd/**,**/delivery/**,**/config/**,**/_mock/**,tools/**,tests/e2e/**,pkg/**
sonar.go.coverage.reportPaths=coverage/*.out
sonar.organization=tiket-sampai-nonton
sonar.projectKey=tiket-sampai-nonton_rusuh-booking-be
sonar.host.url=https://sonarcloud.io
