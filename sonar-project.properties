# SonarCloud. Organisasi dan project key dikirim dari workflow (repo variables
# SONAR_ORGANIZATION dan SONAR_PROJECT_KEY), bukan ditulis di sini.
sonar.sources=.
sonar.exclusions=**/_mock/**,**/*_test.go,docs/**,specs/**,.github/**,.kiro/**,deployments/**,**/deployments/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.coverage.exclusions=**/cmd/**,**/delivery/**,**/config/**,**/_mock/**
sonar.go.coverage.reportPaths=coverage/*.out
