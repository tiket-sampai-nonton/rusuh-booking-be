# Docker Compose lokal: infra + migrasi + 5 service (ADR-012 untuk cloud; ini hanya lokal/assessor).
# Jalankan: make up   (membuat kunci token lokal lalu `docker compose up -d --build`)
# UI: RabbitMQ http://localhost:15672 (guest/guest), Mailpit (email OTP & e-tiket) http://localhost:8025
name: rusuh-booking-be

x-go-env: &go-env
  APP_ENV: local
  LOG_LEVEL: info
  LOG_FORMAT: json
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: rbt
  POSTGRES_SSLMODE: disable
  VALKEY_SERVER: '[{"host":"valkey","port":6379}]'
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/

# Kunci PII khusus lokal (bukan rahasia). PII_HASH_KEY User = PII_HMAC_KEY Queue agar nik_hash cocok;
# PII_ENC_KEY harus sama di producer dan consumer yang mendekripsi email_enc (User -> Notification).
x-pii: &pii-env
  PII_ENC_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
  PII_HASH_KEY: 101112131415161718191a1b1c1d1e1f000102030405060708090a0b0c0d0e0f
  PII_HMAC_KEY: 101112131415161718191a1b1c1d1e1f000102030405060708090a0b0c0d0e0f # sama dengan PII_HASH_KEY

x-keys-volume: &keys-volume
  - ./deployments/compose/keys:/run/keys:ro

x-depends-infra: &depends-infra
  postgres:
    condition: service_healthy
  valkey:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  # ------------------------------------------------------------------ infra
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rbt
      POSTGRES_PASSWORD: rbt-local-only
      POSTGRES_DB: rbt
    ports: ["5432:5432"]
    volumes:
      - ./deployments/compose/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./deployments/compose/postgres-local-passwords.sql:/docker-entrypoint-initdb.d/01-local-passwords.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rbt -d rbt"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8.1-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["1025:1025", "8025:8025"]

  # ------------------------------------------------------------------ migrasi (sekali jalan, per service dengan role-nya sendiri)
  queue-migrate:
    build: { context: ., dockerfile: services/queue/deployments/Dockerfile }
    image: rusuh-booking-queue:local
    command: ["migrate", "up"]
    environment: &queue-env
      <<: [*go-env, *pii-env]
      APP_PORT: "8081"
      POSTGRES_USER: svc_queue
      POSTGRES_PASSWORD: queue-local-only
      POSTGRES_SCHEMA: queue
      TOKEN_PRIVATE_KEY_FILE: /run/keys/queue-token.pem
      TOKEN_PUBLIC_KEY_FILE: /run/keys/user-token.pub.pem
      BOOKING_SERVICE_URL: http://booking-api:8082
    depends_on: { postgres: { condition: service_healthy } }
    volumes: *keys-volume
    restart: "no"

  booking-migrate:
    build: { context: ., dockerfile: services/booking/deployments/Dockerfile }
    image: rusuh-booking-booking:local
    command: ["migrate", "up"]
    environment: &booking-env
      <<: [*go-env, *pii-env]
      APP_PORT: "8082"
      POSTGRES_USER: svc_booking
      POSTGRES_PASSWORD: booking-local-only
      POSTGRES_SCHEMA: booking
      # Queue key: admission + visitor + service tokens. User key: buyer tokens (/me/bookings, admin).
      TOKEN_PUBLIC_KEY_PATH: /run/keys/queue-token.pub.pem
      USER_TOKEN_PUBLIC_KEY_PATH: /run/keys/user-token.pub.pem
      # Calls to Payment (expiry, cancel) and Payment's calls to /internal/v1/bookings/*.
      PAYMENT_SERVICE_URL: http://payment-api:8083
      SERVICE_TOKEN_PRIVATE_KEY_PATH: /run/keys/booking-token.pem
      PAYMENT_TOKEN_PUBLIC_KEY_PATH: /run/keys/payment-token.pub.pem
      # Admin endpoints: buyer tokens of these emails only; empty = nobody (fail closed).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  payment-migrate:
    build: { context: ., dockerfile: services/payment/deployments/Dockerfile }
    image: rusuh-booking-payment:local
    command: ["migrate", "up"]
    environment: &payment-env
      <<: *go-env
      APP_PORT: "8083"
      POSTGRES_USER: svc_payment
      POSTGRES_PASSWORD: payment-local-only
      POSTGRES_SCHEMA: payment
      BOOKING_SERVICE_URL: http://booking-api:8082
      TOKEN_PUBLIC_KEY_FILE: /run/keys/queue-token.pub.pem
      SERVICE_TOKEN_PRIVATE_KEY_FILE: /run/keys/payment-token.pem
      BOOKING_TOKEN_PUBLIC_KEY_FILE: /run/keys/booking-token.pub.pem
      # Midtrans Snap Sandbox. The server key is a secret: export it (or put it in an ignored .env); never commit it.
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      PAYMENT_SUCCESS_RETURN_URL: ${PAYMENT_SUCCESS_RETURN_URL:-http://localhost:8081/payment/success}
      PAYMENT_FAILED_RETURN_URL: ${PAYMENT_FAILED_RETURN_URL:-http://localhost:8081/payment/failed}
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  notification-migrate:
    build: { context: ., dockerfile: services/notification/deployments/Dockerfile }
    image: rusuh-booking-notification:local
    command: ["migrate", "up"]
    environment: &notification-env
      <<: [*go-env, *pii-env]
      APP_PORT: "8084"
      POSTGRES_USER: svc_notification
      POSTGRES_PASSWORD: notification-local-only
      POSTGRES_SCHEMA: notification
      TOKEN_PUBLIC_KEY_FILE: /run/keys/queue-token.pub.pem
      TOKEN_KEY_ID: queue-1
      TOKEN_ISSUER: rbt-queue
      TOKEN_AUDIENCE: rbt
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # Page that shows e-tickets; the e-ticket email links to {base}/{bookingId}?t={token}. Empty = no link in the email.
      TICKET_LINK_BASE_URL: ${TICKET_LINK_BASE_URL:-}
    depends_on: { postgres: { condition: service_healthy } }
    volumes: *keys-volume
    restart: "no"

  user-migrate:
    build: { context: ., dockerfile: services/user/deployments/Dockerfile }
    image: rusuh-booking-user:local
    command: ["migrate", "up"]
    environment: &user-env
      <<: [*go-env, *pii-env]
      APP_PORT: "8085"
      POSTGRES_USER: svc_user
      POSTGRES_PASSWORD: user-local-only
      POSTGRES_SCHEMA: users
      TOKEN_PRIVATE_KEY_FILE: /run/keys/user-token.pem
      OTP_HASH_KEY: 202122232425262728292a2b2c2d2e2f000102030405060708090a0b0c0d0e0f
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    volumes: *keys-volume
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  # ------------------------------------------------------------------ service (satu image, satu verb per container)
  queue-api:
    image: rusuh-booking-queue:local
    command: ["api"]
    environment: *queue-env
    volumes: *keys-volume
    ports: ["8081:8081"]
    depends_on:
      <<: *depends-infra
      queue-migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  queue-worker:
    image: rusuh-booking-queue:local
    command: ["worker"]
    environment: *queue-env
    volumes: *keys-volume
    depends_on:
      <<: *depends-infra
      queue-migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  booking-api:
    image: rusuh-booking-booking:local
    command: ["api"]
    environment: *booking-env
    volumes: *keys-volume
    ports: ["8082:8082"]
    depends_on:
      <<: *depends-infra
      booking-migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  booking-worker:
    image: rusuh-booking-booking:local
    command: ["worker"]
    environment: *booking-env
    volumes: *keys-volume
    depends_on:
      <<: *depends-infra
      booking-migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  payment-api:
    image: rusuh-booking-payment:local
    command: ["api"]
    environment: *payment-env
    volumes: *keys-volume
    ports: ["8083:8083"]
    depends_on:
      <<: *depends-infra
      payment-migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  payment-worker:
    image: rusuh-booking-payment:local
    command: ["worker"]
    environment: *payment-env
    volumes: *keys-volume
    depends_on:
      <<: *depends-infra
      payment-migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  notification-api:
    image: rusuh-booking-notification:local
    command: ["api"]
    environment: *notification-env
    volumes: *keys-volume
    ports: ["8084:8084"]
    depends_on:
      <<: *depends-infra
      notification-migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  notification-worker:
    image: rusuh-booking-notification:local
    command: ["worker"]
    environment: *notification-env
    volumes: *keys-volume
    depends_on:
      <<: *depends-infra
      notification-migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  user-api:
    image: rusuh-booking-user:local
    command: ["api"]
    environment: *user-env
    volumes: *keys-volume
    ports: ["8085:8085"]
    depends_on:
      <<: *depends-infra
      user-migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    restart: unless-stopped

  # ------------------------------------------------------------ observability
  # Tidak ikut `make up`. Jalankan: make obs  (profile "observability").
  # Grafana http://localhost:3000 (tanpa login, khusus lokal), Prometheus :9090, Loki :3100, Alloy :12345.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./deployments/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.5.7
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deployments/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    ports: ["3100:3100"]

  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.10.0
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./deployments/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/rbt:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["12345:12345"]
    depends_on:
      loki: { condition: service_started }

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deployments/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on:
      prometheus: { condition: service_started }
      loki: { condition: service_started }

volumes:
  promdata:
  lokidata:
  grafanadata:
  pgdata:
