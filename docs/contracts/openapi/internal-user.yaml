---
openapi: 3.1.0
info:
  title: RBT User Internal API
  version: 1.0.0
  description: 'Dipanggil Booking Service. Selalu `Authorization: Bearer <buyer access token>`
    dan `X-Request-ID`. Tidak diekspos lewat ALB publik.'
  contact:
    name: Tim PT. Tiket Sampai Nonton Sentosa
servers:
- url: https://api.rusuh.example
  description: Edge (CloudFront → ALB); ganti saat RFS
- url: http://localhost:{port}
  description: Docker Compose lokal
  variables:
    port:
      default: '8085'
security:
- buyerBearer: []
paths:
  "/internal/v1/accounts/{id}/attendee-nik-enc":
    get:
      tags:
      - internal
      summary: Ambil NIK terenkripsi akun untuk fitur useLoginNik (dipanggil Booking)
      operationId: getAttendeeNikEnc
      description: |
        Mengembalikan NIK terenkripsi (AES-256-GCM, AAD `users.accounts.nik`) milik akun yang bersangkutan.
        Booking Service men-unseal lalu me-re-seal dengan AAD-nya sendiri sebelum menyimpan (ADR-030).
        NIK plaintext tidak pernah melewati jaringan.
        Auth: bearer harus merupakan access token User Service yang valid dengan subject == `{id}`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID akun; harus sama dengan subject token
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: Diteruskan antar service; dibuat bila kosong
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    "$ref": "#/components/schemas/Meta"
                  data:
                    type: object
                    properties:
                      nikEnc:
                        type: string
                        description: NIK terenkripsi dikodekan Base64 Standard
                        example: "dGVzdA=="
                    required:
                    - nikEnc
                required:
                - meta
                - data
        '401':
          description: 'Token tidak valid, kedaluwarsa, atau subject != path id — errorCode: `UNAUTHORIZED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: 'Akun tidak ditemukan atau belum memiliki NIK — errorCode: `NOT_FOUND`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    buyerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token User Service (scope buyer); subject harus sama dengan {id}
  schemas:
    Meta:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    ErrorEnvelope:
      type: object
      properties:
        meta:
          "$ref": "#/components/schemas/Meta"
      required:
      - meta
