# Dihasilkan dari SDD v1.5 §4.6 (tools: scratchpad gen2/contracts.py). Ubah kontrak lewat PR yang direview BE dan FE.
openapi: 3.1.0
info:
  title: RBT Queue Service API
  version: 1.0.0
  description: Waiting room publik. Kontrak normatif; ringkasan di SDD §4.6.1.
  contact:
    name: Tim PT. Tiket Sampai Nonton Sentosa
servers:
- url: https://api.rusuh.example
  description: Edge (CloudFront → ALB); ganti saat RFS
- url: http://localhost:{port}
  description: Docker Compose lokal
  variables:
    port:
      default: '8081'
security: []
paths:
  /api/v1/events/{eventId}/queue-entries:
    post:
      tags:
      - queue
      summary: Masuk antrean (anonim untuk semua pembeli, ADR-030)
      operationId: joinQueue
      description: |
        Join antrean anonim untuk semua pembeli (guest dan login, web dan app): tanpa NIK, email, atau consent.
        Body tidak dibaca; klien lama yang masih mengirim buyerNik/email/consent ditoleransi, nilainya dibuang
        (tidak disimpan, tidak masuk log). NIK dan email diisi di halaman Booking saat hold.

        Identitas: visitor token (cookie HttpOnly `rb_visitor` di web, header `X-Visitor-Token` di app) dan,
        opsional, `Authorization: Bearer` (access token User Service). Bearer hanya mengidentifikasi akun untuk dedup;
        claim NIK pada token diabaikan. Satu entri aktif per visitor dan per akun.
        - Token valid milik entri aktif: 200 dengan entri itu (tidak membuat entri kedua).
        - Bearer dengan akun yang sudah punya entri aktif dan tanpa token valid: 200 (re-attach) dengan entri akun itu
          dan visitor token baru untuk perangkat ini. Token yang menunjuk entri AKUN LAIN diabaikan.
        - Bearer + token entri anonim lain sementara akun sudah punya entri aktif: 409 `ACCOUNT_ALREADY_IN_QUEUE`.
        - `Idempotency-Key` (16..64 karakter) opsional: replay mengembalikan entri yang sama (200).
        Bila tidak ada pengantre lebih awal dan slot tersedia, respons langsung ADMITTED (FR-05); Booking mereservasi
        hingga 3 unit untuk event (jaminan kuantitas, bukan kategori) tanpa NIK pembeli.
        Semua join FIFO ketat atas seq (jendela acak pembukaan/undian DIBUANG — ADR-030 Amandemen 2026-11-05).
      security:
      - {}
      - userBearer: []
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: Diteruskan antar service; dibuat bila kosong
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 16
          maxLength: 64
        description: Replay dengan key yang sama (scope akun, visitor, atau anonim) mengembalikan entri yang sama
      - name: X-Visitor-Token
        in: header
        required: false
        schema:
          type: string
        description: Visitor token (app). Web memakai cookie HttpOnly `rb_visitor`.
      - name: X-Device-Id
        in: header
        required: false
        schema:
          type: string
        description: Id acak per instalasi/profil browser. Hanya HMAC-nya yang masuk ke token; bukan kontrol bot.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
      responses:
        '200':
          description: Entri aktif yang sudah ada dikembalikan (token valid, re-attach akun, atau replay Idempotency-Key)
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    $ref: '#/components/schemas/QueueEntry'
                required:
                - meta
                - data
        '201':
          description: Masuk antrean (WAITING) atau langsung ADMITTED
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    $ref: '#/components/schemas/QueueEntry'
                required:
                - meta
                - data
        '409':
          description: 'Konflik antrean — errorCode: `ACCOUNT_ALREADY_IN_QUEUE`, `EVENT_NOT_ON_SALE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: 'Tiket habis — errorCode: `EVENT_SOLD_OUT`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Batas lunak per IP terlampaui (lihat header Retry-After; bukan blokir permanen karena NAT seluler) — errorCode: `RATE_LIMITED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 'Dependency sementara tidak tersedia; ulangi dengan Idempotency-Key yang sama — errorCode: `DEPENDENCY_UNAVAILABLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/queue-status/{eventId}:
    get:
      tags:
      - queue
      summary: Status Document (CDN, 1 detik)
      operationId: getQueueStatus
      security: []
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Status Document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusDocument'
        '404':
          description: 'Event tidak ada — errorCode: `NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/queue-entries/me:
    get:
      tags:
      - queue
      summary: Posisi eksak (saat dekat giliran)
      operationId: getMyEntry
      security:
      - visitorCookie: []
      - visitorHeader: []
      parameters:
      - name: eventId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    $ref: '#/components/schemas/EntryStatus'
                required:
                - meta
                - data
        '401':
          description: 'Token tidak valid, kedaluwarsa, sudah dirotasi, atau perangkat tidak cocok — errorCode: `VISITOR_TOKEN_INVALID`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'Visitor tidak pernah punya entri untuk event ini — errorCode: `NOT_FOUND`. Entri yang sudah berakhir dijawab 200 dengan state ENDED dan reason.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Terlalu banyak request (lihat header Retry-After) — errorCode: `RATE_LIMITED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/queue-entries/me/heartbeat:
    post:
      tags:
      - queue
      summary: Sinyal hidup entri (ADR-030)
      operationId: heartbeat
      description: |
        Dikirim klien pada interval `nextHeartbeatMs` selama WAITING/STALE. Entri yang senyap lebih dari
        stale_after (90 dtk) menjadi STALE (dilewati promotor, seq tetap) dan hidup kembali pada heartbeat berikutnya
        di seq aslinya; senyap lebih dari end_after (300 dtk) tanpa admisi -> ENDED (STALE_TIMEOUT). Tanpa body;
        tanpa data pribadi.
      security:
      - visitorCookie: []
      - visitorHeader: []
      parameters:
      - name: eventId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Device-Id
        in: header
        required: false
        schema:
          type: string
        description: Wajib bila token diterbitkan dengan X-Device-Id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    $ref: '#/components/schemas/HeartbeatStatus'
                required:
                - meta
                - data
        '401':
          description: 'Token tidak valid/dirotasi/perangkat tidak cocok — errorCode: `VISITOR_TOKEN_INVALID`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'Token valid, entri sudah berakhir — errorCode: `ENTRY_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Heartbeat melebihi batas per visitor (RATE_LIMIT_HEARTBEAT_PER_VISITOR per menit; lihat Retry-After) — errorCode: `RATE_LIMITED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/queue-entries/{entryId}/claim:
    post:
      tags:
      - queue
      summary: Ambil admission token saat giliran tiba
      operationId: claimTurn
      security:
      - visitorCookie: []
      - visitorHeader: []
      parameters:
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: eventId
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: Event dari entri antrean; entri dicari per event.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    $ref: '#/components/schemas/ClaimResponse'
                required:
                - meta
                - data
        '401':
          description: 'Token visitor dirotasi (generasi lama) — errorCode: `VISITOR_TOKEN_INVALID`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'Entry tidak ditemukan, bukan milik visitor ini, atau sudah selesai (LEFT/ENDED/COMPLETED) — errorCode: `NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'Entry masih WAITING dan belum mendapat giliran — errorCode: `NOT_ADMITTED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: 'Giliran terlewat atau tiket habis — errorCode: `TURN_MISSED`, `EVENT_SOLD_OUT`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Terlalu banyak request (lihat header Retry-After) — errorCode: `RATE_LIMITED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/queue-entries/{entryId}:
    delete:
      tags:
      - queue
      summary: Keluar dari antrean (SHOULD)
      operationId: leaveQueue
      security:
      - visitorCookie: []
      - visitorHeader: []
      parameters:
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Keluar; slot tidak dipakai lagi
        '401':
          description: 'Token visitor dirotasi (generasi lama) — errorCode: `VISITOR_TOKEN_INVALID`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'Tidak ada entry — errorCode: `NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /health:
    get:
      tags:
      - ops
      summary: Health (ALB dan HEALTHCHECK container, D-23)
      operationId: health
      security: []
      responses:
        '200':
          description: Semua dependency UP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Ada dependency DOWN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Meta:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
          description: 'Pada error berformat "KODE: pesan" (KODE dari daftar SRS §3.1.4 Error Codes); error internal memakai pesan umum.'
        requestId:
          type: string
          description: Hanya pada respons sukses. Pada error, requestId dikirim di header X-Request-ID.
        errorCode:
          type: string
          deprecated: true
          description: Tidak lagi dikirim (platform R2.8). Kode error ada di awalan meta.message.
        details:
          type: object
          deprecated: true
          description: Tidak lagi dikirim (platform R2.8). Detail hanya ditulis ke log.
          additionalProperties:
            type: string
      required:
      - code
    ErrorEnvelope:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          type: 'null'
      required:
      - meta
      - data
      description: Error envelope SRS §3.1.4. Tidak pernah memuat SQL, stack trace, secret, atau payload provider.
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
        service:
          type: string
        checkedAt:
          type: string
          format: date-time
        dependencies:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
                enum:
                - UP
                - DOWN
              latencyMs:
                type: integer
              reason:
                type: string
            required:
            - name
            - status
      required:
      - status
      - service
      - checkedAt
      - dependencies
    JoinRequest:
      type: object
      additionalProperties: true
      description: |
        Join anonim (ADR-030): tidak ada field yang dibaca. buyerNik, email, emailConfirmation, dan consentNik
        sudah dihapus dari kontrak; klien lama yang masih mengirimnya ditoleransi dan nilainya dibuang.
        Tidak ada field challenge/bot token: pemeriksaan bot di sisi klien tidak dibangun (keputusan pemilik).
    QueueEntry:
      type: object
      properties:
        entryId:
          type: string
          format: uuid
        seq:
          type: integer
        status:
          type: string
          enum:
          - WAITING
          - ADMITTED
          - CLAIMED
          - MISSED
          - LEFT
          - SOLD_OUT
          - CLOSED
          - COMPLETED
          - ENDED
          - STALE
        state:
          type: string
          enum:
          - WAITING
          - STALE
          - ADMITTED
          - CLAIMED
          - ENDED
          description: Status klien (ADR-030; draw dibuang pada Amandemen 2026-11-05). STALE = heartbeat senyap.
        rank:
          type:
          - integer
          - 'null'
          description: Urutan admisi (FIFO ketat atas seq; ADR-030 Amandemen 2026-11-05). null saat ENDED.
        queueToken:
          type: string
        visitorToken:
          type: string
          description: |
            Hanya untuk mobile (web: cookie HttpOnly). Selalu untuk generasi token TERKINI; rotasi (re-attach akun,
            join ulang setelah entri berakhir) mencabut token lama (heartbeat/me lama -> 401 VISITOR_TOKEN_INVALID).
            Bila request membawa X-Device-Id, token terikat ke HMAC-nya.
        statusUrl:
          type: string
        claimDeadline:
          type: string
          format: date-time
        joinedAt:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
      required:
      - entryId
      - seq
      - status
      - joinedAt
      - serverTime
    EntryStatus:
      type: object
      properties:
        entryId:
          type: string
          format: uuid
        seq:
          type: integer
        status:
          type: string
          description: Status tersimpan (mentah)
        state:
          type: string
          enum:
          - WAITING
          - STALE
          - ADMITTED
          - CLAIMED
          - ENDED
          description: Status klien (ADR-030; draw dibuang pada Amandemen 2026-11-05). STALE = heartbeat senyap.
        rank:
          type:
          - integer
          - 'null'
          description: Urutan admisi (FIFO ketat atas seq; ADR-030 Amandemen 2026-11-05). null saat ENDED.
        exactPosition:
          type: integer
          description: 1 + jumlah entri hidup (WAITING, bukan STALE) dengan seq lebih kecil
        zone:
          type:
          - string
          - 'null'
          enum:
          - GUARANTEED
          - POSSIBLE
          - NOT_ENOUGH
          - null
          description: Dihitung server dari seq (otoritatif). null saat ADMITTED/CLAIMED atau ENDED.
        nextHeartbeatMs:
          type: integer
          description: Interval heartbeat berikutnya (±20% jitter; lebih pendek dekat head)
        claimDeadline:
          type: string
          format: date-time
        reason:
          type: string
          enum:
          - LEFT
          - STALE_TIMEOUT
          - CLAIM_WINDOW_EXPIRED
          - PAGE_TIMER_EXPIRED
          - JOURNEY_ENDED
          description: Hanya untuk state ENDED (adendum 2)
        redirect:
          type: string
      required:
      - entryId
      - seq
      - status
      - state
      - rank
      - zone
    HeartbeatStatus:
      type: object
      properties:
        entryId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - WAITING
          - ADMITTED
          - CLAIMED
        rank:
          type:
          - integer
          - 'null'
        nextHeartbeatMs:
          type: integer
      required:
      - state
      - rank
      - nextHeartbeatMs
    ClaimResponse:
      type: object
      properties:
        admissionToken:
          type: string
          description: Sekali pakai, TTL 60 detik
        bookingUrl:
          type: string
      required:
      - admissionToken
      - bookingUrl
    StatusDocument:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        saleState:
          type: string
          enum:
          - NOT_STARTED
          - OPEN
          - CLOSED
        headSeq:
          type:
          - integer
          - 'null'
          description: Seq entri hidup terdepan (0 bila antrean kosong)
        guaranteedUntilSeq:
          type:
          - integer
          - 'null'
          description: Seq entri hidup ke-G, G = ceil(stok bebas / 3); 0 = zona kosong.
        possibleUntilSeq:
          type:
          - integer
          - 'null'
          description: Seq entri hidup ke-P, P = ceil((bebas + teralokasi + ditahan) / 3); 0 = zona kosong.
        soldOut:
          type: boolean
        remainingTickets:
          type: integer
        admissionRatePerMin:
          type: integer
        removedBuckets:
          type: object
          properties:
            size:
              type: integer
            fromSeq:
              type: integer
            counts:
              type: array
              items:
                type: integer
        nextPollAfterMs:
          type: integer
        poll:
          type: object
          properties:
            farMs:
              type: integer
            midMs:
              type: integer
            nearMs:
              type: integer
            farAbove:
              type: integer
            midAbove:
              type: integer
        preTurnNotifyPosition:
          type: integer
        categories:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
              state:
                type: string
                enum:
                - AVAILABLE
                - LIMITED
                - SOLD_OUT
        updatedAt:
          type: string
          format: date-time
      required:
      - eventId
      - saleState
      - soldOut
      - updatedAt
      description: 'Dokumen publik tanpa data pribadi; Cache-Control: public, max-age=1, stale-while-revalidate=2'
  securitySchemes:
    visitorCookie:
      type: apiKey
      in: cookie
      name: rb_visitor
      description: Visitor token web (HttpOnly, Secure, SameSite=Lax)
    visitorHeader:
      type: apiKey
      in: header
      name: X-Visitor-Token
      description: Visitor token mobile (secure storage)
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA)
      description: |
        Access token User Service (login OTP, opsional).
        Saat join queue (ADR-030) token hanya mengidentifikasi akun untuk dedup (satu entri aktif per akun);
        claim NIK pada token tidak dipakai. NIK dan email pembeli diisi di halaman Booking.
