# Dihasilkan dari SDD v1.5 §4.6 (tools: scratchpad gen2/contracts.py). Ubah kontrak lewat PR yang direview BE dan FE.
openapi: 3.1.0
info:
  title: RBT Queue Service API
  version: 1.0.0
  description: Waiting room publik. Kontrak normatif; ringkasan di SDD §4.6.1.
  contact:
    name: Tim PT. Tiket Sampai Nonton Sentosa
servers:
- url: https://api.rusuh.example
  description: Edge (CloudFront → ALB); ganti saat RFS
- url: http://localhost:{port}
  description: Docker Compose lokal
  variables:
    port:
      default: '8081'
security: []
paths:
  /api/v1/events/{eventId}/queue-entries:
    post:
      tags:
      - queue
      summary: Masuk antrean (guest, atau login opsional)
      operationId: joinQueue
      description: 'Guest: cukup NIK pembeli + email. Bila header Authorization (access token User Service) dikirim, akun dicatat di entry dan
        NIK harus sama dengan NIK tersimpan di akun (ADR-020). Bila tidak ada pengantre lebih awal dan slot tersedia, respons langsung ADMITTED
        (FR-05).'
      security:
      - {}
      - userBearer: []
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: Diteruskan antar service; dibuat bila kosong
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
      responses:
        '201':
          description: Masuk antrean (WAITING) atau langsung ADMITTED
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    $ref: '#/components/schemas/QueueEntry'
                required:
                - meta
                - data
        '400':
          description: 'Field tidak valid — errorCode: `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'Konflik antrean — errorCode: `NIK_ALREADY_IN_QUEUE`, `VISITOR_ALREADY_IN_QUEUE`, `EMAIL_ALREADY_IN_QUEUE`, `BUYER_QUOTA_EXHAUSTED`,
            `EVENT_NOT_ON_SALE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: 'Tiket habis — errorCode: `EVENT_SOLD_OUT`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'Input tidak valid — errorCode: `NIK_INVALID`, `EMAIL_MISMATCH`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Terlalu banyak request (lihat header Retry-After) — errorCode: `RATE_LIMITED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 'Dependency sementara tidak tersedia; ulangi dengan Idempotency-Key yang sama — errorCode: `DEPENDENCY_UNAVAILABLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/queue-status/{eventId}:
    get:
      tags:
      - queue
      summary: Status Document (CDN, 1 detik)
      operationId: getQueueStatus
      security: []
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Status Document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusDocument'
        '404':
          description: 'Event tidak ada — errorCode: `NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/queue-entries/me:
    get:
      tags:
      - queue
      summary: Posisi eksak (saat dekat giliran)
      operationId: getMyEntry
      security:
      - visitorCookie: []
      - visitorHeader: []
      parameters:
      - name: eventId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    $ref: '#/components/schemas/EntryStatus'
                required:
                - meta
                - data
        '404':
          description: 'Tidak ada entry — errorCode: `NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Terlalu banyak request (lihat header Retry-After) — errorCode: `RATE_LIMITED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/queue-entries/{entryId}/claim:
    post:
      tags:
      - queue
      summary: Ambil admission token saat giliran tiba
      operationId: claimTurn
      security:
      - visitorCookie: []
      - visitorHeader: []
      parameters:
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    $ref: '#/components/schemas/ClaimResponse'
                required:
                - meta
                - data
        '410':
          description: 'Giliran terlewat atau tiket habis — errorCode: `TURN_MISSED`, `EVENT_SOLD_OUT`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Terlalu banyak request (lihat header Retry-After) — errorCode: `RATE_LIMITED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/queue-entries/{entryId}:
    delete:
      tags:
      - queue
      summary: Keluar dari antrean (SHOULD)
      operationId: leaveQueue
      security:
      - visitorCookie: []
      - visitorHeader: []
      parameters:
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Keluar; slot tidak dipakai lagi
        '404':
          description: 'Tidak ada entry — errorCode: `NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /health:
    get:
      tags:
      - ops
      summary: Health (ALB dan HEALTHCHECK container, D-23)
      operationId: health
      security: []
      responses:
        '200':
          description: Semua dependency UP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Ada dependency DOWN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Meta:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        requestId:
          type: string
        errorCode:
          type: string
          description: Ada hanya pada error; daftar di SRS §3.1.4 Error Codes
        details:
          type: object
          additionalProperties:
            type: string
      required:
      - code
    ErrorEnvelope:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          type: 'null'
      required:
      - meta
      - data
      description: Error envelope SRS §3.1.4. Tidak pernah memuat SQL, stack trace, secret, atau payload provider.
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
        service:
          type: string
        checkedAt:
          type: string
          format: date-time
        dependencies:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
                enum:
                - UP
                - DOWN
              latencyMs:
                type: integer
              reason:
                type: string
            required:
            - name
            - status
      required:
      - status
      - service
      - checkedAt
      - dependencies
    JoinRequest:
      type: object
      properties:
        buyerNik:
          type: string
          pattern: ^[0-9]{16}$
          description: NIK 16 digit (dicek strukturnya; tidak pernah disimpan plaintext)
        email:
          type: string
          format: email
        emailConfirmation:
          type: string
          format: email
        consentNik:
          type: boolean
          const: true
      required:
      - buyerNik
      - email
      - emailConfirmation
      - consentNik
    QueueEntry:
      type: object
      properties:
        entryId:
          type: string
          format: uuid
        seq:
          type: integer
        status:
          type: string
          enum:
          - WAITING
          - ADMITTED
          - CLAIMED
          - MISSED
          - LEFT
          - SOLD_OUT
          - CLOSED
          - COMPLETED
          - ENDED
        queueToken:
          type: string
        visitorToken:
          type: string
          description: Hanya untuk mobile
        statusUrl:
          type: string
        claimDeadline:
          type: string
          format: date-time
        joinedAt:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
      required:
      - entryId
      - seq
      - status
      - joinedAt
      - serverTime
    EntryStatus:
      type: object
      properties:
        entryId:
          type: string
          format: uuid
        seq:
          type: integer
        status:
          type: string
        exactPosition:
          type: integer
        zone:
          type: string
          enum:
          - GUARANTEED
          - POSSIBLE
          - NOT_ENOUGH
        claimDeadline:
          type: string
          format: date-time
        reason:
          type: string
        redirect:
          type: string
      required:
      - entryId
      - seq
      - status
    ClaimResponse:
      type: object
      properties:
        admissionToken:
          type: string
          description: Sekali pakai, TTL 60 detik
        bookingUrl:
          type: string
      required:
      - admissionToken
      - bookingUrl
    StatusDocument:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        saleState:
          type: string
          enum:
          - NOT_STARTED
          - OPEN
          - CLOSED
        servingSeq:
          type: integer
        guaranteedUntilSeq:
          type: integer
        possibleUntilSeq:
          type: integer
        soldOut:
          type: boolean
        remainingTickets:
          type: integer
        admissionRatePerMin:
          type: integer
        removedBuckets:
          type: object
          properties:
            size:
              type: integer
            fromSeq:
              type: integer
            counts:
              type: array
              items:
                type: integer
        nextPollAfterMs:
          type: integer
        poll:
          type: object
          properties:
            farMs:
              type: integer
            midMs:
              type: integer
            nearMs:
              type: integer
            farAbove:
              type: integer
            midAbove:
              type: integer
        preTurnNotifyPosition:
          type: integer
        categories:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
              state:
                type: string
                enum:
                - AVAILABLE
                - LIMITED
                - SOLD_OUT
        updatedAt:
          type: string
          format: date-time
      required:
      - eventId
      - saleState
      - servingSeq
      - soldOut
      - updatedAt
      description: 'Dokumen publik tanpa data pribadi; Cache-Control: public, max-age=1, stale-while-revalidate=2'
  securitySchemes:
    visitorCookie:
      type: apiKey
      in: cookie
      name: rb_visitor
      description: Visitor token web (HttpOnly, Secure, SameSite=Lax)
    visitorHeader:
      type: apiKey
      in: header
      name: X-Visitor-Token
      description: Visitor token mobile (secure storage)
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA)
      description: Access token User Service (login OTP, opsional)
