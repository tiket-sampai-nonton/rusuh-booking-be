# Dihasilkan dari SDD v1.5 §4.6 (tools: scratchpad gen2/contracts.py). Ubah kontrak lewat PR yang direview BE dan FE.
---
openapi: 3.1.0
info:
  title: RBT Booking Service API
  version: 1.0.0
  description: Katalog event, sesi pilih, hold, ubah pesanan, e-tiket. Agregat Booking
    memakai event sourcing (ADR-019).
  contact:
    name: Tim PT. Tiket Sampai Nonton Sentosa
servers:
- url: https://api.rusuh.example
  description: Edge (CloudFront → ALB); ganti saat RFS
- url: http://localhost:{port}
  description: Docker Compose lokal
  variables:
    port:
      default: '8082'
security:
- visitorCookie: []
- visitorHeader: []
paths:
  "/api/v1/events":
    get:
      tags:
      - catalog
      summary: Daftar event dengan filter (cache 2 detik, SRS-F-28)
      operationId: listEvents
      security: []
      parameters:
      - name: timeframe
        in: query
        required: false
        description: Filter waktu (SRS-F-28-01)
        schema:
          type: string
          enum:
          - ALL
          - THIS_WEEK
          - THIS_MONTH
          - UPCOMING
          default: ALL
      - name: city
        in: query
        required: false
        description: Filter lokasi/kota (SRS-F-28-02)
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Filter status ketersediaan (SRS-F-28-03)
        schema:
          type: string
          enum:
          - ALL
          - NOT_STARTED
          - AVAILABLE
          - SOLD_OUT
          - CLOSED
          default: ALL
      - name: sort
        in: query
        required: false
        description: Urutan hasil (SRS-F-28-06)
        schema:
          type: string
          enum:
          - DATE_ASC
          - PRICE_ASC
          - PRICE_DESC
          default: DATE_ASC
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    "$ref": "#/components/schemas/Meta"
                  data:
                    "$ref": "#/components/schemas/EventList"
                required:
                - meta
                - data
        '401':
          description: 'Token visitor tidak valid atau kedaluwarsa — errorCode: `UNAUTHORIZED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/events/{eventId}":
    get:
      tags:
      - catalog
      summary: Detail event dan kategori (cache 2 detik)
      operationId: getEvent
      security: []
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    "$ref": "#/components/schemas/Meta"
                  data:
                    "$ref": "#/components/schemas/EventDetail"
                required:
                - meta
                - data
        '404':
          description: 'Event tidak ada — errorCode: `NOT_FOUND`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: 'Token visitor tidak valid atau kedaluwarsa — errorCode: `UNAUTHORIZED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '400':
          description: 'Parameter path bukan UUID atau body tidak valid — errorCode:
            `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/booking-sessions":
    post:
      tags:
      - booking
      summary: Buat atau pulihkan sesi dari admission token
      operationId: createSession
      security:
      - visitorCookie: []
      - visitorHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateSessionRequest"
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    "$ref": "#/components/schemas/Meta"
                  data:
                    "$ref": "#/components/schemas/BookingSession"
                required:
                - meta
                - data
        '403':
          description: 'Token salah atau dipakai ulang — errorCode: `ADMISSION_TOKEN_INVALID`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '410':
          description: 'Giliran lewat — errorCode: `TURN_MISSED`, `SESSION_EXPIRED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: 'Token visitor tidak valid atau kedaluwarsa — errorCode: `UNAUTHORIZED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/booking-sessions/current":
    get:
      tags:
      - booking
      summary: Pulihkan sesi/pesanan (refresh, koneksi putus, back)
      operationId: getCurrentSession
      security:
      - visitorCookie: []
      - visitorHeader: []
      parameters:
      - name: eventId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    "$ref": "#/components/schemas/Meta"
                  data:
                    "$ref": "#/components/schemas/BookingSession"
                required:
                - meta
                - data
        '404':
          description: 'Tidak ada sesi aktif — errorCode: `NOT_FOUND`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '429':
          description: 'Terlalu banyak request (lihat header Retry-After) — errorCode:
            `RATE_LIMITED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: 'Token visitor tidak valid atau kedaluwarsa — errorCode: `UNAUTHORIZED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/booking-sessions/{sessionId}":
    get:
      tags:
      - booking
      summary: Sisa waktu dan ketersediaan live (fallback SSE)
      operationId: getSession
      security:
      - visitorCookie: []
      - visitorHeader: []
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    "$ref": "#/components/schemas/Meta"
                  data:
                    "$ref": "#/components/schemas/BookingSession"
                required:
                - meta
                - data
        '410':
          description: 'Sesi habis — errorCode: `SESSION_EXPIRED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: 'Token visitor tidak valid atau kedaluwarsa — errorCode: `UNAUTHORIZED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: 'Tidak ada atau bukan milik pemanggil — errorCode: `NOT_FOUND`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: 'Token valid tetapi bukan pemilik sesi/pesanan — errorCode:
            `VISITOR_MISMATCH`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '400':
          description: 'Parameter path bukan UUID atau body tidak valid — errorCode:
            `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/booking-sessions/{sessionId}/stream":
    get:
      tags:
      - booking
      summary: SSE ketersediaan kategori dan sisa waktu
      operationId: streamSession
      security:
      - visitorCookie: []
      - visitorHeader: []
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 'text/event-stream: event `availability` dan `timer`; heartbeat
            SSE_HEARTBEAT_SECONDS'
          content:
            text/event-stream:
              schema:
                type: string
        '503':
          description: 'Batas koneksi SSE instance tercapai; klien beralih ke polling
            — errorCode: `DEPENDENCY_UNAVAILABLE`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: 'Token visitor tidak valid atau kedaluwarsa — errorCode: `UNAUTHORIZED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: 'Tidak ada atau bukan milik pemanggil — errorCode: `NOT_FOUND`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: 'Token valid tetapi bukan pemilik sesi/pesanan — errorCode:
            `VISITOR_MISMATCH`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '400':
          description: 'Parameter path bukan UUID atau body tidak valid — errorCode:
            `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/booking-sessions/{sessionId}/attendee-checks":
    post:
      tags:
      - booking
      summary: Cek NIK pemegang saat diketik
      operationId: checkAttendee
      security:
      - visitorCookie: []
      - visitorHeader: []
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AttendeeCheckRequest"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    "$ref": "#/components/schemas/Meta"
                  data:
                    "$ref": "#/components/schemas/AttendeeCheck"
                required:
                - meta
                - data
        '422':
          description: 'Struktur NIK salah (jatah cek tidak berkurang) — errorCode:
            `NIK_INVALID`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '429':
          description: 'Terlalu banyak request (lihat header Retry-After) — errorCode:
            `RATE_LIMITED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: 'Token visitor tidak valid atau kedaluwarsa — errorCode: `UNAUTHORIZED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: 'Tidak ada atau bukan milik pemanggil — errorCode: `NOT_FOUND`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: 'Token valid tetapi bukan pemilik sesi/pesanan — errorCode:
            `VISITOR_MISMATCH`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '400':
          description: 'Parameter path bukan UUID atau body tidak valid — errorCode:
            `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/booking-sessions/{sessionId}/cancel":
    post:
      tags:
      - booking
      summary: Keluar tanpa membeli
      operationId: cancelSession
      security:
      - visitorCookie: []
      - visitorHeader: []
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Alokasi dilepas ke pengantre berikutnya
        '401':
          description: 'Token visitor tidak valid atau kedaluwarsa — errorCode: `UNAUTHORIZED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: 'Tidak ada atau bukan milik pemanggil — errorCode: `NOT_FOUND`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: 'Token valid tetapi bukan pemilik sesi/pesanan — errorCode:
            `VISITOR_MISMATCH`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '400':
          description: 'Parameter path bukan UUID atau body tidak valid — errorCode:
            `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/bookings":
    post:
      tags:
      - booking
      summary: 'Hold: NIK dan nama pemegang per tiket'
      operationId: createBooking
      security:
      - visitorCookie: []
      - visitorHeader: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 64
        description: Unik per tombol; retry memakai key yang sama (SRS §3.2.24)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/HoldRequest"
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    "$ref": "#/components/schemas/Meta"
                  data:
                    "$ref": "#/components/schemas/Booking"
                required:
                - meta
                - data
        '400':
          description: 'Field tidak valid — errorCode: `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '409':
          description: 'Konflik — errorCode: `ATTENDEE_NIK_ALREADY_REGISTERED`, `ATTENDEE_NIK_DUPLICATE_IN_ORDER`,
            `CATEGORY_UNAVAILABLE`, `BUYER_QUOTA_EXHAUSTED`, `IDEMPOTENCY_KEY_REUSED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '410':
          description: 'Sesi habis — errorCode: `SESSION_EXPIRED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: 'Melebihi batas atau aturan event — errorCode: `QUANTITY_EXCEEDS_LIMIT`,
            `MIXED_CATEGORIES_NOT_ALLOWED`, `NIK_INVALID`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '503':
          description: 'Dependency sementara tidak tersedia; ulangi dengan Idempotency-Key
            yang sama — errorCode: `DEPENDENCY_UNAVAILABLE`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: 'Token visitor tidak valid atau kedaluwarsa — errorCode: `UNAUTHORIZED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/bookings/{bookingId}/items":
    put:
      tags:
      - booking
      summary: Ubah pesanan sebelum Bayar (penggantian atomik)
      operationId: replaceItems
      security:
      - visitorCookie: []
      - visitorHeader: []
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 64
        description: Unik per tombol; retry memakai key yang sama (SRS §3.2.24)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ReplaceItemsRequest"
      responses:
        '200':
          description: Pesanan baru; paymentExpiresAt tidak berubah
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    "$ref": "#/components/schemas/Meta"
                  data:
                    "$ref": "#/components/schemas/Booking"
                required:
                - meta
                - data
        '409':
          description: 'Konflik; pesanan lama tetap utuh — errorCode: `BOOKING_LOCKED`,
            `BOOKING_VERSION_CONFLICT`, `EDIT_LIMIT_REACHED`, `CATEGORY_UNAVAILABLE`,
            `ATTENDEE_NIK_ALREADY_REGISTERED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: 'Melebihi batas — errorCode: `QUANTITY_EXCEEDS_LIMIT`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: 'Token visitor tidak valid atau kedaluwarsa — errorCode: `UNAUTHORIZED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: 'Tidak ada atau bukan milik pemanggil — errorCode: `NOT_FOUND`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: 'Token valid tetapi bukan pemilik sesi/pesanan — errorCode:
            `VISITOR_MISMATCH`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '400':
          description: 'Parameter path bukan UUID atau body tidak valid — errorCode:
            `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/bookings/{bookingId}":
    get:
      tags:
      - booking
      summary: Status booking
      operationId: getBooking
      security:
      - visitorCookie: []
      - visitorHeader: []
      - ticketLink: []
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    "$ref": "#/components/schemas/Meta"
                  data:
                    "$ref": "#/components/schemas/Booking"
                required:
                - meta
                - data
        '404':
          description: 'Tidak ada — errorCode: `NOT_FOUND`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: 'Token visitor tidak valid atau kedaluwarsa — errorCode: `UNAUTHORIZED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: 'Token valid tetapi bukan pemilik sesi/pesanan — errorCode:
            `VISITOR_MISMATCH`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '400':
          description: 'Parameter path bukan UUID atau body tidak valid — errorCode:
            `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/bookings/{bookingId}/cancel":
    post:
      tags:
      - booking
      summary: Batal sebelum bayar (SHOULD)
      operationId: cancelBooking
      security:
      - visitorCookie: []
      - visitorHeader: []
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    "$ref": "#/components/schemas/Meta"
                  data:
                    "$ref": "#/components/schemas/Booking"
                required:
                - meta
                - data
        '409':
          description: 'Tidak bisa dibatalkan — errorCode: `BOOKING_LOCKED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: 'Token visitor tidak valid atau kedaluwarsa — errorCode: `UNAUTHORIZED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: 'Tidak ada atau bukan milik pemanggil — errorCode: `NOT_FOUND`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: 'Token valid tetapi bukan pemilik sesi/pesanan — errorCode:
            `VISITOR_MISMATCH`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '400':
          description: 'Parameter path bukan UUID atau body tidak valid — errorCode:
            `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/bookings/{bookingId}/tickets":
    get:
      tags:
      - booking
      summary: E-tiket (setelah PAID)
      operationId: getTickets
      security:
      - visitorCookie: []
      - visitorHeader: []
      - ticketLink: []
      - userBearer: []
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    "$ref": "#/components/schemas/Meta"
                  data:
                    "$ref": "#/components/schemas/TicketList"
                required:
                - meta
                - data
        '409':
          description: 'Belum PAID — errorCode: `BOOKING_NOT_PAYABLE`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: 'Token visitor tidak valid atau kedaluwarsa — errorCode: `UNAUTHORIZED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: 'Tidak ada atau bukan milik pemanggil — errorCode: `NOT_FOUND`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: 'Token valid tetapi bukan pemilik sesi/pesanan — errorCode:
            `VISITOR_MISMATCH`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '400':
          description: 'Parameter path bukan UUID atau body tidak valid — errorCode:
            `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      description: 'Hanya untuk pemilik booking: visitor token yang sama, akun pembeli
        yang sama (bearer), atau tautan e-tiket dari email (?t=). Selain itu 404 (tidak
        dibedakan dari booking yang tidak ada). 409 bila belum PAID.'
  "/api/v1/me/bookings":
    get:
      tags:
      - booking
      summary: Riwayat pesanan pembeli yang login (ADR-020)
      operationId: listMyBookings
      security:
      - userBearer: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    "$ref": "#/components/schemas/Meta"
                  data:
                    "$ref": "#/components/schemas/MyBookings"
                required:
                - meta
                - data
        '401':
          description: 'Access token tidak valid — errorCode: `UNAUTHORIZED`'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/health":
    get:
      tags:
      - ops
      summary: Health (ALB dan HEALTHCHECK container, D-23)
      operationId: health
      security: []
      responses:
        '200':
          description: Semua dependency UP
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
        '503':
          description: Ada dependency DOWN
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
components:
  schemas:
    Meta:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
          description: 'Pada error berformat "KODE: pesan" (KODE dari daftar SRS §3.1.4
            Error Codes); error internal memakai pesan umum.'
        requestId:
          type: string
          description: Hanya pada respons sukses. Pada error, requestId dikirim di
            header X-Request-ID.
        errorCode:
          type: string
          deprecated: true
          description: Tidak lagi dikirim (platform R2.8). Kode error ada di awalan
            meta.message.
        details:
          type: object
          deprecated: true
          description: Tidak lagi dikirim (platform R2.8). Detail hanya ditulis ke
            log.
          additionalProperties:
            type: string
      required:
      - code
    ErrorEnvelope:
      type: object
      properties:
        meta:
          "$ref": "#/components/schemas/Meta"
        data:
          type: 'null'
      required:
      - meta
      - data
      description: Error envelope SRS §3.1.4. Tidak pernah memuat SQL, stack trace,
        secret, atau payload provider.
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
        service:
          type: string
        checkedAt:
          type: string
          format: date-time
        dependencies:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
                enum:
                - UP
                - DOWN
              latencyMs:
                type: integer
              reason:
                type: string
            required:
            - name
            - status
      required:
      - status
      - service
      - checkedAt
      - dependencies
    EventSummary:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        venue:
          type: string
        startsAt:
          type: string
          format: date-time
        salesStartsAt:
          type: string
          format: date-time
        salesEndsAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - NOT_STARTED
          - AVAILABLE
          - SOLD_OUT
          - CLOSED
        minPriceMinor:
          type: integer
          format: int64
          minimum: 0
          description: Minor unit IDR
        imageUrl:
          type: string
          description: URL gambar utama; tidak ada bila belum diunggah (API admin images)
        bannerUrl:
          type: string
          description: URL banner (hero detail event); tidak ada bila belum diunggah
        thumbnailUrl:
          type: string
          description: URL thumbnail kartu katalog; tidak ada bila belum diunggah
      required:
      - eventId
      - slug
      - name
      - salesStartsAt
      - salesEndsAt
      - status
    EventList:
      type: object
      properties:
        events:
          type: array
          items:
            "$ref": "#/components/schemas/EventSummary"
        serverTime:
          type: string
          format: date-time
      required:
      - events
      - serverTime
    EventDetail:
      type: object
      properties:
        event:
          "$ref": "#/components/schemas/EventSummary"
        maxTicketsPerOrder:
          type: integer
        maxTicketsPerBuyerNik:
          type: integer
        allowMixedCategories:
          type: boolean
        categories:
          type: array
          items:
            type: object
            properties:
              categoryId:
                type: string
                format: uuid
              code:
                type: string
              name:
                type: string
              priceMinor:
                type: integer
                format: int64
                minimum: 0
                description: Minor unit IDR
              available:
                type: integer
            required:
            - categoryId
            - code
            - name
            - priceMinor
            - available
      required:
      - event
      - categories
    CreateSessionRequest:
      type: object
      properties:
        admissionToken:
          type: string
      required:
      - admissionToken
    BookingSession:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        phase:
          type: string
          enum:
          - SELECTING
          - EDITABLE
          - LOCKED
          - ENDED
        reason:
          type: string
        reservedUnits:
          type: integer
        maxSelectable:
          type: integer
        buyerNikMasked:
          type: string
          example: 3174********0001
          description: NIK tersamar
        allowMixedCategories:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
        submitGraceSeconds:
          type: integer
        selectionWarningSeconds:
          type: integer
        editEnabled:
          type: boolean
        maxEdits:
          type: integer
        categories:
          type: array
          items:
            type: object
            properties:
              categoryId:
                type: string
                format: uuid
              code:
                type: string
              name:
                type: string
              priceMinor:
                type: integer
                format: int64
                minimum: 0
                description: Minor unit IDR
              available:
                type: integer
            required:
            - categoryId
            - code
            - name
            - priceMinor
            - available
        booking:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/Booking"
      required:
      - sessionId
      - eventId
      - phase
      - reservedUnits
      - maxSelectable
      - expiresAt
      - serverTime
      - categories
    AttendeeCheckRequest:
      type: object
      properties:
        nik:
          type: string
          pattern: "^[0-9]{16}$"
          description: NIK 16 digit (dicek strukturnya; tidak pernah disimpan plaintext)
      required:
      - nik
    AttendeeCheck:
      type: object
      properties:
        result:
          type: string
          enum:
          - AVAILABLE
          - ALREADY_REGISTERED
          - CHECK_LIMIT_REACHED
        checksRemaining:
          type: integer
      required:
      - result
      - checksRemaining
    HoldRequest:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            properties:
              categoryId:
                type: string
                format: uuid
              attendee:
                type: object
                properties:
                  nik:
                    type: string
                    pattern: "^[0-9]{16}$"
                    description: NIK 16 digit (dicek strukturnya; tidak pernah disimpan
                      plaintext)
                  fullName:
                    type: string
                    minLength: 1
                    maxLength: 100
                required:
                - nik
                - fullName
            required:
            - categoryId
            - attendee
      required:
      - sessionId
      - items
    ReplaceItemsRequest:
      type: object
      properties:
        version:
          type: integer
        items:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            properties:
              categoryId:
                type: string
                format: uuid
              attendee:
                oneOf:
                - type: object
                  properties:
                    nik:
                      type: string
                      pattern: "^[0-9]{16}$"
                      description: NIK 16 digit (dicek strukturnya; tidak pernah disimpan
                        plaintext)
                    fullName:
                      type: string
                      minLength: 1
                      maxLength: 100
                  required:
                  - nik
                  - fullName
                - type: object
                  properties:
                    keepFromItemId:
                      type: string
                      format: uuid
                  required:
                  - keepFromItemId
                  description: Pertahankan pemegang item lama tanpa mengirim ulang
                    NIK
            required:
            - categoryId
            - attendee
      required:
      - version
      - items
    Booking:
      type: object
      properties:
        bookingId:
          type: string
          format: uuid
        publicRef:
          type: string
          example: RB-00912
        orderId:
          type: string
          description: Nomor pesanan untuk pelanggan; sama dengan publicRef.
          example: RB-00912
        ticketQuantity:
          type: integer
          minimum: 1
          maximum: 3
        buyerNikMasked:
          type: string
          example: 3174********0001
          description: NIK pembeli tersamar; NIK asli tidak pernah dikembalikan.
        status:
          type: string
          enum:
          - PENDING_PAYMENT
          - VERIFYING
          - PAID
          - EXPIRED
          - CANCELLED
          - REVIEW
        amountMinor:
          type: integer
          format: int64
          minimum: 0
          description: Minor unit IDR
        currency:
          type: string
          const: IDR
        paymentExpiresAt:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
        version:
          type: integer
          description: Versi stream booking_events terakhir (ADR-019); kirim saat
            ubah pesanan
        canEdit:
          type: boolean
        editableUntil:
          type: string
          format: date-time
        editsRemaining:
          type: integer
        lockReason:
          type:
          - string
          - 'null'
          enum:
          - PAYMENT_STARTED
          - SELECTION_EXPIRED
          - BOOKING_ENDED
          - EDIT_DISABLED
          - 
        paymentPageUrl:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              itemId:
                type: string
                format: uuid
              categoryId:
                type: string
                format: uuid
              attendeeNikMasked:
                type: string
                example: 3174********0001
                description: NIK tersamar
              attendeeName:
                type: string
            required:
            - itemId
            - categoryId
            - attendeeNikMasked
            - attendeeName
      required:
      - bookingId
      - publicRef
      - status
      - amountMinor
      - orderId
      - ticketQuantity
      - buyerNikMasked
      - paymentExpiresAt
      - serverTime
      - version
      - canEdit
    Ticket:
      type: object
      properties:
        ticketCode:
          type: string
        categoryCode:
          type: string
        attendeeName:
          type: string
        attendeeNikMasked:
          type: string
          example: 3174********0001
          description: NIK tersamar
        qrPayload:
          type: string
          description: String untuk dirender sebagai QR (RBT:<ticketCode>). Tidak
            memuat data pribadi.
      required:
      - ticketCode
      - categoryCode
      - attendeeName
      - attendeeNikMasked
      - qrPayload
    TicketList:
      type: object
      properties:
        bookingId:
          type: string
          format: uuid
        orderId:
          type: string
        publicRef:
          type: string
        amountMinor:
          type: integer
          format: int64
        ticketQuantity:
          type: integer
          minimum: 1
          maximum: 3
        buyerNikMasked:
          type: string
          example: 3174********0001
        tickets:
          type: array
          items:
            "$ref": "#/components/schemas/Ticket"
      required:
      - bookingId
      - orderId
      - publicRef
      - amountMinor
      - ticketQuantity
      - buyerNikMasked
      - tickets
    MyBookings:
      type: object
      properties:
        bookings:
          type: array
          items:
            type: object
            properties:
              bookingId:
                type: string
                format: uuid
              publicRef:
                type: string
              eventName:
                type: string
              status:
                type: string
                enum:
                - PENDING_PAYMENT
                - VERIFYING
                - PAID
                - EXPIRED
                - CANCELLED
                - REVIEW
              amountMinor:
                type: integer
                format: int64
                minimum: 0
                description: Minor unit IDR
              createdAt:
                type: string
                format: date-time
        nextCursor:
          type:
          - string
          - 'null'
      required:
      - bookings
      description: Riwayat pesanan pembeli yang login (ADR-020)
  securitySchemes:
    visitorCookie:
      type: apiKey
      in: cookie
      name: rb_visitor
      description: Visitor token web (HttpOnly, Secure, SameSite=Lax)
    visitorHeader:
      type: apiKey
      in: header
      name: X-Visitor-Token
      description: Visitor token mobile (secure storage)
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA)
      description: Access token User Service (login OTP, opsional)
    ticketLink:
      type: apiKey
      in: query
      name: t
      description: Ticket link token dari email e-tiket
