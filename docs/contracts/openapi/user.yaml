# Dihasilkan dari SDD v1.5 §4.6 (tools: scratchpad gen2/contracts.py). Ubah kontrak lewat PR yang direview BE dan FE.
openapi: 3.1.0
info:
  title: RBT User Service API
  version: 1.0.0
  description: 'Akun opsional (ADR-020): login OTP email tanpa password, rotasi refresh token, profil. Guest checkout tidak membutuhkan service
    ini.'
  contact:
    name: Tim PT. Tiket Sampai Nonton Sentosa
servers:
- url: https://api.rusuh.example
  description: Edge (CloudFront → ALB); ganti saat RFS
- url: http://localhost:{port}
  description: Docker Compose lokal
  variables:
    port:
      default: '8085'
security: []
paths:
  /api/v1/auth/otp/request:
    post:
      tags:
      - auth
      summary: Kirim kode OTP 6 digit ke email
      operationId: requestOtp
      security: []
      description: 'Respons sama untuk email terdaftar maupun belum (anti enumerasi). Batas: OTP_MAX_PER_EMAIL_HOUR per email, OTP_MAX_PER_IP_HOUR
        per IP, cooldown OTP_RESEND_COOLDOWN.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOTPRequest'
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    $ref: '#/components/schemas/RequestOTPResponse'
                required:
                - meta
                - data
        '400':
          description: 'Field tidak valid — errorCode: `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Terlalu sering — errorCode: `OTP_RESEND_TOO_SOON`, `RATE_LIMITED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 'Email belum bisa dikirim — errorCode: `DEPENDENCY_UNAVAILABLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/otp/verify:
    post:
      tags:
      - auth
      summary: Tukar kode OTP dengan token; akun dibuat saat login pertama
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    $ref: '#/components/schemas/TokenResponse'
                required:
                - meta
                - data
        '400':
          description: 'Field tidak valid — errorCode: `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 'Kode salah/kedaluwarsa (details.attemptsLeft) — errorCode: `OTP_INVALID`, `OTP_EXPIRED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Akun dinonaktifkan — errorCode: `ACCOUNT_DISABLED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Terlalu banyak percobaan — errorCode: `OTP_LOCKED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Rotasi refresh token
      operationId: refreshToken
      security: []
      description: Refresh token lama langsung dicabut. Token lama yang dipakai ulang mencabut semua sesi akun (deteksi pencurian).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    $ref: '#/components/schemas/TokenResponse'
                required:
                - meta
                - data
        '401':
          description: 'Sesi tidak valid — errorCode: `SESSION_INVALID`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Akun dinonaktifkan — errorCode: `ACCOUNT_DISABLED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Cabut sesi (idempoten)
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Sesi dicabut (atau memang tidak ada)
  /api/v1/me:
    get:
      tags:
      - profile
      summary: Profil pembeli yang login
      operationId: getMe
      security:
      - userBearer: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    $ref: '#/components/schemas/Profile'
                required:
                - meta
                - data
        '401':
          description: 'Access token tidak valid — errorCode: `UNAUTHORIZED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags:
      - profile
      summary: Ubah nama dan/atau NIK tersimpan
      operationId: updateMe
      security:
      - userBearer: []
      description: NIK disimpan terenkripsi (AES-256-GCM) dan unik antar akun; respons hanya memuat NIK tersamar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    $ref: '#/components/schemas/Profile'
                required:
                - meta
                - data
        '400':
          description: 'Field tidak valid — errorCode: `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 'Access token tidak valid — errorCode: `UNAUTHORIZED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'NIK sudah tertaut ke akun lain — errorCode: `NIK_ALREADY_LINKED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /health:
    get:
      tags:
      - ops
      summary: Health (ALB dan HEALTHCHECK container, D-23)
      operationId: health
      security: []
      responses:
        '200':
          description: Semua dependency UP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Ada dependency DOWN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Meta:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
          description: 'Pada error berformat "KODE: pesan" (KODE dari daftar SRS §3.1.4 Error Codes); error internal memakai pesan umum.'
        requestId:
          type: string
          description: Hanya pada respons sukses. Pada error, requestId dikirim di header X-Request-ID.
        errorCode:
          type: string
          deprecated: true
          description: Tidak lagi dikirim (platform R2.8). Kode error ada di awalan meta.message.
        details:
          type: object
          deprecated: true
          description: Tidak lagi dikirim (platform R2.8). Detail hanya ditulis ke log.
          additionalProperties:
            type: string
      required:
      - code
    ErrorEnvelope:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          type: 'null'
      required:
      - meta
      - data
      description: Error envelope SRS §3.1.4. Tidak pernah memuat SQL, stack trace, secret, atau payload provider.
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
        service:
          type: string
        checkedAt:
          type: string
          format: date-time
        dependencies:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
                enum:
                - UP
                - DOWN
              latencyMs:
                type: integer
              reason:
                type: string
            required:
            - name
            - status
      required:
      - status
      - service
      - checkedAt
      - dependencies
    RequestOTPRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
    RequestOTPResponse:
      type: object
      properties:
        expiresInSeconds:
          type: integer
        resendAfterSeconds:
          type: integer
      required:
      - expiresInSeconds
      - resendAfterSeconds
    VerifyOTPRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: ^[0-9]{6}$
      required:
      - email
      - code
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
      - refreshToken
    Profile:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        emailMasked:
          type: string
        fullName:
          type: string
        nikMasked:
          type: string
          example: 3174********0001
          description: NIK tersamar
        hasNik:
          type: boolean
      required:
      - accountId
      - emailMasked
      - hasNik
    TokenResponse:
      type: object
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
        account:
          $ref: '#/components/schemas/Profile'
      required:
      - tokenType
      - accessToken
      - accessTokenExpiresAt
      - refreshToken
      - refreshTokenExpiresAt
      - account
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        nik:
          type: string
          pattern: ^[0-9]{16}$
          description: NIK 16 digit (dicek strukturnya; tidak pernah disimpan plaintext)
      description: Field yang tidak dikirim tidak diubah; minimal satu field
      minProperties: 1
      additionalProperties: false
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA)
      description: |
        Access token User Service (login OTP, opsional).
        Token claims (SRS-F-27-10, PRD v5.4):
        - sub: account UUID
        - email: email akun
        - nik_hash: HMAC-SHA256 dari NIK (null jika belum tersimpan)
        - has_nik: boolean (true jika NIK tersimpan)
        Queue Service gunakan nik_hash langsung saat has_nik=true.
